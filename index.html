<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>言汐OPC一人公司</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --primary: #365cff;
      --text: #1f2a44;
      --muted: #5f6b85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #eef2ff 0%, #f9fbff 55%, #f6f8ff 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }

    .hero {
      background: var(--card);
      border-radius: 18px;
      padding: 42px 28px;
      box-shadow: 0 16px 48px rgba(31, 42, 68, 0.1);
    }

    h1 {
      font-size: clamp(2rem, 3.5vw, 3rem);
      margin: 0;
      line-height: 1.2;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      margin: 16px 0 0;
      max-width: 640px;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eaf0ff;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .features {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .feature {
      background: #f9fbff;
      border: 1px solid #e7edff;
      border-radius: 12px;
      padding: 16px;
    }

    .feature h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .feature p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .contact {
      margin-top: 28px;
      padding: 16px;
      border-left: 4px solid var(--primary);
      background: #f5f8ff;
      border-radius: 8px;
      color: var(--muted);
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: #7d86a1;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <span class="tag">言汐OPC一人公司</span>
      <h1>让想法更快落地，一人也能跑出专业团队效率</h1>
      <p class="subtitle">
        欢迎来到言汐OPC一人公司。我们专注于用轻量、实用、可持续的方式，帮助个人创业者和小团队完成品牌展示、业务自动化和数字化增长。
      </p>

      <div class="features">
        <article class="feature">
          <h3>网站搭建</h3>
          <p>从企业官网到落地页，提供快速上线与后续维护支持。</p>
        </article>
        <article class="feature">
          <h3>流程自动化</h3>
          <p>把重复工作交给系统，提升运营效率，减少人力消耗。</p>
        </article>
        <article class="feature">
          <h3>内容与品牌</h3>
          <p>统一视觉与表达，让你的产品和服务更容易被理解和记住。</p>
        </article>
      </div>

      <div class="contact">
        合作咨询：请在此处填写你的邮箱或微信（示例：contact@yxopc.com）
      </div>
    </section>

    <footer>© 2026 言汐OPC一人公司 · 保留所有权利</footer>
  </main>
</body>
</html>
